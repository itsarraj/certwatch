[package]
name = "certwatch"
version = "0.1.0"
edition = "2021"
description = "A TLS certificate expiry watcher — checks a list of domains, warns before certs lapse"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/certwatch"
readme = "README.md"
keywords = ["tls", "ssl", "certificate", "expiry", "monitoring"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "certwatch"
path = "src/lib.rs"

[[bin]]
name = "certwatch"
path = "src/main.rs"

[dependencies]
rustls = "0.23"
x509-parser = "0.16"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
rcgen = "0.13"
time = "0.3"
